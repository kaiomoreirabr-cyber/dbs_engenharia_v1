<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- ALTERAÇÃO: viewport-fit=cover permite usar env(safe-area-inset-*) no
         CSS, para a barra inferior de navegação respeitar a "ilha dinâmica"
         / faixa de gestos do iPhone e não ficar colada na borda. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d71920" />
    <meta name="description" content="Controle de frequência de obras: cadastre obras, faça a chamada da equipe e gere o fechamento de pagamento com chave Pix." />

    <!-- ALTERAÇÃO: bloco novo — deixa o app instalável na tela inicial
         (PWA), abrindo em tela cheia, sem a barra de endereço do navegador. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Frequência" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Controle de Frequência de Obras</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- ALTERAÇÃO: registra o service worker (public/sw.js) só em produção,
         depois que a página carregar, para não atrapalhar o "npm run dev". -->
    <script>
      if ("serviceWorker" in navigator && !location.hostname.includes("localhost")) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
